
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Personal Growth Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-brand">
            <div class="brand-logo">PG</div>

            <h1>Personal Growth Tracker</h1>

            <p>
                Small steps. Consistent progress.
                A better version of yourself.
            </p>
        </section>

        <section class="auth-card">

            <div class="auth-heading">
                <h2>Welcome back</h2>
                <p>Log in to continue your growth journey.</p>
            </div>

            <form id="login-form">

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="auth-options">
                    <label class="remember-option">
                        <input type="checkbox" id="remember-me">
                        Remember me
                    </label>

                    <a href="forgot-password.html">
                        Forgot password?
                    </a>
                </div>

                <button type="submit" class="primary-button">
                    Log In
                </button>

                <p id="login-message" class="form-message"></p>

            </form>

            <div class="auth-footer">
                <p>
                    Don't have an account?
                    <a href="register.html">Create one</a>
                </p>
            </div>

        </section>

        <footer class="auth-bottom">
            Personal Growth Tracker &copy; 2026
        </footer>

    </main>

    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
