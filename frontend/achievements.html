
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achievements | Personal Growth Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-logo">PG</div>
            <h2>Growth Tracker</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="goals.html">My Goals</a>
            <a href="activities.html">Activities</a>
            <a href="reflections.html">Daily Reflections</a>
            <a href="growth-history.html">Growth History</a>
            <a href="achievements.html" class="active">Achievements</a>
            <a href="reports.html">Reports</a>
        </nav>
        <div class="sidebar-bottom">
            <a href="profile.html">My Profile</a>
            <a href="settings.html">Settings</a>
            <a href="index.html" class="logout-button">Log Out</a>
        </div>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <div>
                <h1>Achievements</h1>
                <p>Celebrate the progress you've made.</p>
            </div>
        </header>

        <section class="stats-grid">
            <article class="stat-card">
                <h3>Goals Completed</h3>
                <p id="achievement-goals-count">0</p>
            </article>

            <article class="stat-card">
                <h3>Milestones Completed</h3>
                <p id="achievement-milestones-count">0</p>
            </article>

            <article class="stat-card">
                <h3>Total Achievements</h3>
                <p id="achievement-total-count">0</p>
            </article>
        </section>

        <section class="content-section">
            <h2>Completed Goals</h2>
            <div id="completed-goals-container" class="content-list"></div>
        </section>

        <section class="content-section">
            <h2>Completed Milestones</h2>
            <div id="completed-milestones-container" class="content-list"></div>
        </section>
    </main>

    <script src="js/common.js"></script>
    <script src="js/achievements.js"></script>
</body>
</html>
