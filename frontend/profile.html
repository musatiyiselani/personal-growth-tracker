
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Personal Growth Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-logo">PG</div>
            <h2>Growth Tracker</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="goals.html">My Goals</a>
            <a href="activities.html">Activities</a>
            <a href="reflections.html">Daily Reflections</a>
            <a href="growth-history.html">Growth History</a>
            <a href="achievements.html">Achievements</a>
            <a href="reports.html">Reports</a>
        </nav>
        <div class="sidebar-bottom">
            <a href="profile.html" class="active">My Profile</a>
            <a href="settings.html">Settings</a>
            <a href="index.html" class="logout-button">Log Out</a>
        </div>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <div>
                <h1>My Profile</h1>
                <p>Manage your personal information.</p>
            </div>
        </header>

        <section class="content-section">
            <h2>Personal Information</h2>

            <form id="profile-form" class="app-form">
                <div class="form-group">
                    <label for="profile-name">Full name</label>
                    <input type="text" id="profile-name" required>
                </div>

                <div class="form-group">
                    <label for="profile-email">Email address</label>
                    <input type="email" id="profile-email" required>
                </div>

                <div class="form-group">
                    <label for="profile-bio">About me</label>
                    <textarea id="profile-bio" rows="4" placeholder="Tell us a little about yourself"></textarea>
                </div>

                <button type="submit" class="primary-button">Save Changes</button>
                <p id="profile-message" class="form-message"></p>
            </form>
        </section>

        <section class="content-section">
            <h2>Profile Picture</h2>

            <div class="profile-picture-row">
                <img id="profile-picture-preview" alt="Your profile picture" width="96" height="96" hidden
                     style="border-radius: 50%; object-fit: cover;">

                <div>
                    <div class="form-group">
                        <label for="profile-picture-input">Choose an image (JPG, PNG or WEBP, up to 5 MB)</label>
                        <input type="file" id="profile-picture-input" accept=".jpg,.jpeg,.png,.webp">
                    </div>

                    <button type="button" id="upload-picture" class="primary-button">Upload Picture</button>
                    <button type="button" id="remove-picture" class="secondary-button">Remove Picture</button>
                    <p id="picture-message" class="form-message"></p>
                </div>
            </div>
        </section>

        <section class="content-section">
            <h2>Account Information</h2>
            <div id="profile-account-info"></div>
        </section>
    </main>

    <script src="js/common.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
