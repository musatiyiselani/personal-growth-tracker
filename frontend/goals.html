
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/favicon.png">
    <title>My Goals | Personal Growth Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-logo"><img src="assets/logo.png" alt="Personal Growth Tracker logo"></div>
            <h2>Growth Tracker</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="goals.html" class="active">My Goals</a>
            <a href="activities.html">Activities</a>
            <a href="reflections.html">Daily Reflections</a>
            <a href="growth-history.html">Growth History</a>
            <a href="achievements.html">Achievements</a>
            <a href="reports.html">Reports</a>
        </nav>
        <div class="sidebar-bottom">
            <a href="profile.html">My Profile</a>
            <a href="settings.html">Settings</a>
            <a href="index.html" class="logout-button">Log Out</a>
        </div>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <div>
                <h1>My Goals</h1>
                <p>Set meaningful goals and track your progress.</p>
            </div>
        </header>

        <section class="content-section">
            <h2>Create a New Goal</h2>

            <form id="goal-form" class="app-form">
                <div class="form-group">
                    <label for="goal-title">Goal title</label>
                    <input type="text" id="goal-title" required placeholder="e.g. Complete my first Python project">
                </div>

                <div class="form-group">
                    <label for="goal-description">Description</label>
                    <textarea id="goal-description" placeholder="Describe what you want to achieve"></textarea>
                </div>

                <div class="form-group">
                    <label for="goal-category">Growth area</label>
                    <select id="goal-category" required>
                        <option value="">Select a category</option>
                        <option value="Education">Education</option>
                        <option value="Web Development">Web Development</option>
                        <option value="Personal Growth">Personal Growth</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="goal-deadline">Deadline</label>
                    <input type="date" id="goal-deadline" required>
                </div>

                <div class="form-group">
                    <label for="goal-target">Weekly target</label>
                    <input type="number" id="goal-target" min="1" required placeholder="e.g. 5">
                </div>

                <div class="form-group">
                    <label for="goal-unit">Target unit</label>
                    <select id="goal-unit" required>
                        <option value="hours">Hours</option>
                        <option value="minutes">Minutes</option>
                        <option value="pages">Pages</option>
                        <option value="sessions">Sessions</option>
                        <option value="tasks">Tasks</option>
                    </select>
                </div>

                <button type="submit" class="primary-button">Create Goal</button>
                <p id="goal-message" class="form-message"></p>
            </form>
        </section>

        <section class="content-section">
            <h2>My Goals</h2>
            <div id="goals-container" class="content-list"></div>
            <p id="no-goals">You haven't created any goals yet.</p>
        </section>

    </main>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/goals.js"></script>
</body>
</html>
