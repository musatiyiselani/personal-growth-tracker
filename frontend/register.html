
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Personal Growth Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-brand">
            <div class="brand-logo">PG</div>

            <h1>Personal Growth Tracker</h1>

            <p>
                Small steps. Consistent progress.
                A better version of yourself.
            </p>
        </section>

        <section class="auth-card">

            <div class="auth-heading">
                <h2>Create your account</h2>
                <p>Start tracking your personal growth today.</p>
            </div>

            <form id="register-form">

                <div class="form-group">
                    <label for="name">Full name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Enter your password again"
                        minlength="8"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="remember-option">
                        <input type="checkbox" id="terms" required>
                        I agree to the terms and conditions.
                    </label>
                </div>

                <button type="submit" class="primary-button">
                    Create Account
                </button>

                <p id="register-message" class="form-message"></p>

            </form>

            <div class="auth-footer">
                <p>
                    Already have an account?
                    <a href="index.html">Log in</a>
                </p>
            </div>

        </section>

        <footer class="auth-bottom">
            Personal Growth Tracker &copy; 2026
        </footer>

    </main>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
