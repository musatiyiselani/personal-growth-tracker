
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/favicon.png">
    <title>Forgot Password | Personal Growth Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-brand">
            <div class="brand-logo"><img src="assets/logo.png" alt="Personal Growth Tracker logo"></div>

            <h1>Personal Growth Tracker</h1>

            <p>
                Small steps. Consistent progress.
                A better version of yourself.
            </p>
        </section>

        <section class="auth-card">

            <div class="auth-heading">
                <h2>Forgot your password?</h2>
                <p>
                    Enter your email address and we'll help you
                    reset your password.
                </p>
            </div>

            <form id="forgot-password-form">

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <button type="submit" class="primary-button">
                    Reset Password
                </button>

                <p id="forgot-password-message" class="form-message"></p>

            </form>

            <div class="auth-footer">
                <p>
                    Remembered your password?
                    <a href="index.html">Log in</a>
                </p>
            </div>

        </section>

        <footer class="auth-bottom">
            Personal Growth Tracker &copy; 2026
        </footer>

    </main>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
